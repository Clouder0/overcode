name: release

on:
  push:
    tags:
      - "overcode-ai-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., overcode-ai-v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Resolve tag + build version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          case "$tag" in
            overcode-ai-v*) ;;
            *)
              echo "Input must be a tag like 'overcode-ai-v1.2.3' (got '$tag')" >&2
              exit 1
              ;;
          esac

          version="${tag#overcode-ai-v}"

          printf '%s\n' "tag=$tag" >> "$GITHUB_OUTPUT"
          printf '%s\n' "version=$version" >> "$GITHUB_OUTPUT"

          printf '%s\n' "OPENCODE_VERSION=$version" >> "$GITHUB_ENV"
          printf '%s\n' "OPENCODE_CHANNEL=latest" >> "$GITHUB_ENV"

      - name: Build
        working-directory: packages/opencode
        run: bun run build

      - name: Package
        working-directory: packages/opencode/dist
        run: |
          shopt -s nullglob
          dirs=(overcode-ai-*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No build outputs found in packages/opencode/dist" >&2
            ls -la
            exit 1
          fi

          for dir in "${dirs[@]}"; do
            name="${dir%/}"
            if [[ "$name" == *"linux"* ]]; then
              (cd "${name}/bin" && tar -czf "../../${name}.tar.gz" *)
            else
              (cd "${name}/bin" && zip -r "../../${name}.zip" *)
            fi
          done

      - name: Create Release
        shell: bash
        run: |
          shopt -s nullglob
          assets=(./packages/opencode/dist/*.tar.gz ./packages/opencode/dist/*.zip)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release artifacts found in ./packages/opencode/dist" >&2
            exit 1
          fi

          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "${{ steps.meta.outputs.tag }}" \
            --generate-notes \
            "${assets[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
