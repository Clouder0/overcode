name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-latest
            target: darwin-x64
          - os: windows-latest
            target: windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        working-directory: packages/opencode
        run: bun run build --single

      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: packages/opencode/dist
        run: |
          for dir in opencode-*/; do
            name="${dir%/}"
            (cd "${name}/bin" && tar -czf "../../${name}.tar.gz" *)
          done

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: packages/opencode/dist
        run: |
          for dir in opencode-*/; do
            name="${dir%/}"
            (cd "${name}/bin" && zip -r "../../${name}.zip" *)
          done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: packages/opencode/dist
        shell: pwsh
        run: |
          Get-ChildItem -Directory | ForEach-Object {
            $name = $_.Name
            $binPath = Join-Path $_.FullName "bin\*"
            Compress-Archive -Path $binPath -DestinationPath "$name.zip"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ matrix.target }}
          path: |
            packages/opencode/dist/*.tar.gz
            packages/opencode/dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
